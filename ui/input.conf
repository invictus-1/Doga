# Dōga's default keys. B cycles audio, V cycles subtitles (Off is in the cycle).
# Changes made in Settings › Hotkeys are stored in %APPDATA%\Doga\settings.json and
# applied on top of these; this file itself never changes.
b         script-binding doga/cycle-audio
B         script-binding doga/cycle-audio-back
v         script-binding doga/cycle-sub
V         script-binding doga/cycle-sub-back

SPACE     no-osd cycle pause
MBTN_RIGHT script-binding doga/context-menu
LEFT      script-binding doga/seek-back
RIGHT     script-binding doga/seek-fwd
Shift+LEFT  no-osd frame-back-step
Shift+RIGHT no-osd frame-step
,         no-osd frame-back-step
.         no-osd frame-step
UP        script-binding doga/vol-up
DOWN      script-binding doga/vol-down
WHEEL_UP  script-binding doga/wheel-up
WHEEL_DOWN script-binding doga/wheel-down
m         script-binding doga/mute
ENTER     no-osd cycle fullscreen
KP_ENTER  no-osd cycle fullscreen
f         no-osd cycle fullscreen
MBTN_LEFT_DBL script-binding doga/dblclick
ESC       script-binding doga/escape
p         script-binding doga/toggle-playlist
i         script-binding doga/toggle-info
o         script-binding doga/open
Ctrl+t    script-binding doga/cycle-theme
Ctrl+,    script-binding doga/settings
PGDWN     no-osd playlist-next
PGUP      no-osd playlist-prev
MBTN_BACK no-osd playlist-prev
MBTN_FORWARD no-osd playlist-next
z         script-binding doga/sub-delay-minus
x         script-binding doga/sub-delay-plus
Ctrl+z    script-binding doga/audio-delay-minus
Ctrl+x    script-binding doga/audio-delay-plus
HOME      script-binding doga/start-over
s         script-binding doga/screenshot
S         script-binding doga/screenshot-subs
# Media keys (keyboards, headphones, the Windows media overlay)
PLAYPAUSE no-osd cycle pause
PLAY      no-osd set pause no
PAUSE     no-osd set pause yes
PLAYONLY  no-osd set pause no
PAUSEONLY no-osd set pause yes
STOP      no-osd stop
NEXT      no-osd playlist-next
PREV      no-osd playlist-prev
FORWARD   no-osd seek 30
REWIND    no-osd seek -30

Ctrl+w    quit
q         quit
CLOSE_WIN quit
